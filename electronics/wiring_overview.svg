<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<defs><style>text{font-family:Arial,sans-serif;fill:#203b43}.title{font-size:32px;font-weight:bold}.sub{font-size:18px}.name{font-size:21px;font-weight:bold}.note{font-size:16px}.node{fill:#fff;stroke:#527981;stroke-width:2}.power{fill:#fff5e7;stroke:#c58438;stroke-width:2}.line{fill:none;stroke:#4a8a95;stroke-width:3}.dc{fill:none;stroke:#c58438;stroke-width:4}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a8a95"/></marker></defs>
<rect width="1600" height="1060" fill="#f0f5f4"/>
<text x="60" y="60" class="title">LUMA / Electrical connections</text>
<text x="60" y="94" class="sub">Revision A · Raspberry Pi 4 master · four bus servos · exactly five ranging sensors</text>
<rect x="60" y="150" width="325" height="425" rx="18" class="node"/>
<text x="85" y="190" class="name">Raspberry Pi 4</text>
<text x="85" y="227" class="sub">USB1: round LCD coprocessor</text>
<text x="85" y="280" class="sub">USB2: serial bus adapter</text>
<text x="85" y="333" class="sub">USB3: local Hi speech speaker</text>
<text x="85" y="386" class="sub">I2C: BCM2 / BCM3</text>
<text x="85" y="439" class="sub">RGB: BCM10 / SPI MOSI</text>
<text x="85" y="492" class="sub">White: BCM18 / PWM</text>
<text x="85" y="545" class="sub">Stop sense: BCM27 + 10k pullup</text>
<rect x="460" y="165" width="490" height="86" rx="13" class="node"/>
<text x="482" y="199" class="name">Waveshare ESP32-S3-Touch-LCD-1.85</text>
<text x="482" y="231" class="sub">SKU28514 · 360×360 TFT · USB serial face commands</text>
<path d="M385 220H460" class="line" marker-end="url(#arrow)"/>
<rect x="460" y="269" width="490" height="76" rx="13" class="node"/>
<text x="482" y="300" class="name">Waveshare Bus Servo Adapter A</text>
<text x="482" y="329" class="sub">1Mbps · ST mode · own fused 12V feed</text>
<path d="M385 273H460" class="line" marker-end="url(#arrow)"/>
<rect x="1030" y="269" width="505" height="76" rx="13" class="node"/>
<text x="1052" y="300" class="name">ST3215 servos 1 → 2 → 3 → 4</text>
<text x="1052" y="329" class="sub">Yaw / shoulder / elbow / wrist · DATA and GND</text>
<path d="M950 307H1030" class="line" marker-end="url(#arrow)"/>
<rect x="460" y="362" width="490" height="58" rx="13" class="node"/>
<text x="482" y="398" class="name">Adafruit3369 USB speaker / espeak-ng</text>
<path d="M385 326H424V390H460" class="line" marker-end="url(#arrow)"/>
<rect x="460" y="438" width="490" height="100" rx="13" class="node"/>
<text x="482" y="472" class="name">Adafruit5626 PCA9548 mux · 0x70</text>
<text x="482" y="503" class="sub">TCA9548A-compatible · 3.3V upstream logic</text>
<path d="M385 379H407V473H460" class="line" marker-end="url(#arrow)"/>
<rect x="1030" y="402" width="505" height="136" rx="13" class="node"/>
<text x="1052" y="436" class="name">Five Adafruit3967 VL53L1X · 0x29 each</text>
<text x="1052" y="470" class="sub">Port0 front · port1 left · port2 right</text>
<text x="1052" y="501" class="sub">Port3 rear · port4 down · one emitter at a time</text>
<path d="M950 486H1030" class="line" marker-end="url(#arrow)"/>
<rect x="460" y="556" width="490" height="103" rx="13" class="node"/>
<text x="482" y="590" class="name">74AHCT125 / two 3.3V → 5V channels</text>
<text x="482" y="621" class="sub">DIP2→3 RGB · DIP5→6 white · 330Ω each output</text>
<text x="482" y="646" class="note">VCC5V on14 · GND7 · enable1 and4 to GND</text>
<path d="M385 432H395V577H460M385 485H417V630H460" class="line" marker-end="url(#arrow)"/>
<rect x="1030" y="556" width="505" height="103" rx="13" class="node"/>
<text x="1052" y="590" class="name">Two independent light rings</text>
<text x="1052" y="621" class="sub">Outer60RGB ≤20% · inner24RGBW: RGB0 / W≤192</text>
<text x="1052" y="646" class="note">1000µF across each ring supply · last outer DOUT open</text>
<path d="M950 589H1030M950 630H1030" class="line" marker-end="url(#arrow)"/>
<rect x="60" y="720" width="325" height="137" rx="13" class="power"/>
<text x="84" y="754" class="name">Two external supplies</text>
<text x="84" y="786" class="sub">Official Pi5.1V / 3A → Pi USB-C</text>
<text x="84" y="818" class="sub">Mean Well12V / 15A → DC only</text>
<rect x="460" y="720" width="490" height="137" rx="13" class="power"/>
<text x="482" y="754" class="name">12V distribution / 15A main fuse</text>
<text x="482" y="786" class="sub">Relay NO → four separate3A fused motor feeds</text>
<text x="482" y="818" class="sub">2A fuse → Pololu buck5V → 3A fuse → LEDs</text>
<path d="M385 806H460" class="dc"/>
<path d="M950 774H1570V307H1535M950 816H990V605H1030" class="dc"/>
<rect x="1030" y="720" width="505" height="137" rx="13" class="power"/>
<text x="1052" y="754" class="name">Latching physical motor stop / two NC</text>
<text x="1052" y="786" class="sub">NC1 opens relay coil12V · diode across coil</text>
<text x="1052" y="818" class="sub">NC2 grounds BCM27 normally · open = STOP</text>
<path d="M1535 834H1550V693H437V538H385" class="line"/>
<text x="60" y="912" class="name">Read wiring.csv for exact connections, fuses, DIP pins and cable notes.</text>
<text x="60" y="947" class="sub">All DC grounds meet at one star point. Never join Pi5V and LED5V. Never carry all motor current through the adapter jack.</text>
<text x="60" y="979" class="sub">Motor stop cuts torque: support the arm. Five narrow ToF cones are interaction inputs and do not cover every pinch point.</text>
<text x="60" y="1015" class="note">Power wires shown in amber; signal routes in blue. Schematic overview: routing lengths and connector positions are not to scale.</text>
</svg>
