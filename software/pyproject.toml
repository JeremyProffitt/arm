[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luma-arm"
version = "0.1.0"
description = "Raspberry Pi master controller for the LUMA expressive robotic lamp"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hardware = [
  "pyserial>=3.5,<4",
  "Adafruit-Blinka>=8,<10",
  "adafruit-circuitpython-vl53l1x>=1,<2",
  "adafruit-circuitpython-tca9548a>=0.7,<1",
  "adafruit-circuitpython-neopixel-spi>=1,<2",
  "adafruit-circuitpython-neopixel>=6,<7",
  "rpi-ws281x>=5,<6",
  "gpiozero>=2,<3"
]

[project.scripts]
luma = "luma.app:main"

[tool.setuptools.packages.find]
include = ["luma*"]
